plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.emprendehub'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Lombok solo para las entidades JPA (@Getter/@Setter/@NoArgsConstructor).
	// Los DTOs son records: nunca @Data ni @Value.
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	// PostgreSQL real para los @DataJpaTest: el enunciado prohíbe bases de
	// datos en memoria, así que nada de H2 ni siquiera en pruebas.
	// Testcontainers 2.x renombró sus módulos con el prefijo "testcontainers-";
	// la versión la gestiona Spring Boot, no se fija aquí.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.jacocoTestReport
}

// La rúbrica exige 80% de cobertura "en la lógica de negocio". Nuestra
// definición, documentada en docs/arquitectura.md, es el paquete service.
jacoco {
	toolVersion = '0.8.13'
}

// Filtro común: solo se mide la lógica de negocio, no controladores ni entidades.
def clasesDeNegocio = { fc ->
	files(fc.files.collect { fileTree(dir: it, includes: ['com/emprendehub/service/**']) })
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.test
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(clasesDeNegocio(classDirectories))
	finalizedBy tasks.jacocoTestCoverageVerification
}

// El umbral que exige la rúbrica. Un PR que lo baje no compila, que es más
// barato que recuperar cobertura al final con doce incrementos encima.
tasks.named('jacocoTestCoverageVerification') {
	violationRules {
		rule {
			element = 'BUNDLE'
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
	classDirectories.setFrom(clasesDeNegocio(classDirectories))
}

tasks.named('check') {
	dependsOn tasks.jacocoTestCoverageVerification
}
