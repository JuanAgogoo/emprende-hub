spring:
  application:
    name: emprendehub

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/emprendehub}
    username: ${DB_USER:emprendehub}
    password: ${DB_PASSWORD:emprendehub}

  jpa:
    hibernate:
      # Hibernate crea y actualiza el esquema a partir de las entidades, como en
      # el taller de CRUD del curso.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota

  threads:
    # Virtual threads de Java 25, tal como los presenta la semana 2 del curso.
    virtual:
      enabled: true

  jackson:
    time-zone: America/Bogota

jwt:
  # Clave de 256 bits como mínimo, que es lo que exige HS256 y lo que advierte
  # el taller. En un despliegue real llegaría por variable de entorno; aquí el
  # valor por defecto sirve para desarrollo y para la demostración.
  secret-key: ${JWT_SECRET:ZW1wcmVuZGVodWItY2xhdmUtZGUtZGVzYXJyb2xsby1zb2xvLTI1Ni1iaXRz}
  # Una hora, el plazo corto que recomienda el taller.
  expiration: ${JWT_EXPIRATION:3600000}

server:
  port: ${PORT:8080}

logging:
  level:
    com.emprendehub: INFO
