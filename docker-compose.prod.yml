# Despliegue de PRODUCCIÓN (docs/despliegue.md). El de desarrollo es docker-compose.yml.
# Solo Caddy publica puertos: Docker se salta UFW con todo lo que publica, así
# que la base y el backend no deben publicar ninguno.
name: emprendehub-prod

x-registro: &registro
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-emprendehub}
      POSTGRES_USER: ${DB_USER:?Falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      TZ: America/Bogota
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    <<: *registro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: America/Bogota
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-emprendehub}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      ADMIN_CORREO: ${ADMIN_CORREO:?Falta ADMIN_CORREO en .env}
      ADMIN_CONTRASENA: ${ADMIN_CONTRASENA:?Falta ADMIN_CONTRASENA en .env}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador}
      APP_URL: ${APP_URL:?Falta APP_URL en .env}
      MODERACION_AUTOMATICA: ${MODERACION_AUTOMATICA:-false}
      SEMILLA_DEMO: ${SEMILLA_DEMO:-false}
      SEMILLA_DEMO_CONTRASENA: ${SEMILLA_DEMO_CONTRASENA:-}
      FOTOS_DIR: /data/uploads
      RECUPERACION_MINUTOS: ${RECUPERACION_MINUTOS:-30}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-1}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-responder@emprendehub.tech}
      MAIL_TIMEOUT_MS: ${MAIL_TIMEOUT_MS:-3000}
    volumes:
      - fotos:/data/uploads
    healthcheck:
      # La imagen JRE no trae curl: se habla HTTP a mano por el puerto.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf "GET /api/v1/catalogos/ciudades HTTP/1.0\r\n\r\n" >&3 &&
          head -1 <&3 | grep -q " 200"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    <<: *registro

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DOMINIO: ${DOMINIO:-emprendehub.tech}
      TZ: America/Bogota
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
      - "${WEB_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    <<: *registro

volumes:
  datos:
  fotos:
  caddy_datos:
  caddy_config:
