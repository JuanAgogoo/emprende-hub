name: Pipeline de Integración Continua

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Si se empuja dos veces seguidas a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest

    # El backend vive en backend/. El frontend tendra su propio job cuando exista.
    defaults:
      run:
        working-directory: backend

    # PostgreSQL real para las pruebas: el enunciado prohíbe bases de datos en
    # memoria. Se publica en el 5433 para que coincida con application.yml y no
    # haga falta ninguna variable de entorno.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: emprendehub
          POSTGRES_USER: emprendehub
          POSTGRES_PASSWORD: emprendehub
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U emprendehub -d emprendehub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Preparar JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar y ejecutar pruebas
        run: ./gradlew build --no-daemon

      - name: Publicar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-cobertura
          path: backend/build/reports/jacoco/test/html
          if-no-files-found: warn

      - name: Publicar el informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas
          path: backend/build/reports/tests/test
          if-no-files-found: warn

  release:
    name: Publicar versión
    needs: build
    # Solo al integrar en main. En los Pull Request no se versiona nada.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write       # crear el tag y la release
      issues: write         # comentar en incidencias referenciadas
      pull-requests: write  # comentar en los PR incluidos

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0    # semantic-release necesita el historial completo

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Calcular y publicar la versión
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes semantic-release@24
